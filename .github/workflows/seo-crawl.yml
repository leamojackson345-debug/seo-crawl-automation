name: Weekly technical SEO crawl

on:
  schedule:
    - cron: "0 3 * * 1"        # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      url:
        description: "Override the start URL"
        required: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SITE_URL: ${{ inputs.url || vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Crawl the site (free built-in crawler)
        run: |
          python crawler.py --url "$SITE_URL" --out crawl-output/latest \
            --max-pages "${{ vars.MAX_PAGES || '2000' }}" --workers 5

      - name: Analyse and notify
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python seo_audit.py --skip-crawl --crawl-dir crawl-output/latest \
            --url "$SITE_URL" --important-pages important_pages.txt

      - name: Upload exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-crawl-${{ github.run_id }}
          path: crawl-output/
          retention-days: 30
